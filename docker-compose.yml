services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecdat
      POSTGRES_USER: ecdat
      POSTGRES_PASSWORD: ecdat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecdat -d ecdat"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./.infrastructure-data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/ecdat-development
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - ./infrastructure/neo4j/init:/var/lib/neo4j/import/init
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ecdat-development 'RETURN 1;' >/dev/null 2>&1 || exit 1"]
      interval: 8s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    environment:
      ECDAT_POSTGRES_DSN: postgresql+psycopg://ecdat:ecdat@postgres:5432/ecdat
      ECDAT_REDIS_URL: redis://redis:6379/0
      ECDAT_NEO4J_URI: bolt://neo4j:7687
      ECDAT_ALLOWED_SCAN_ROOTS: /workspace,/tmp,/var/lib/ecdat/intake
      ECDAT_INTAKE_DIR: /var/lib/ecdat/intake
    command: sh -lc "cd /workspace && alembic upgrade head && uvicorn ecdat.api.app:create_app --factory --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./:/workspace:ro
      - ecdat_intake:/var/lib/ecdat/intake
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    environment:
      ECDAT_POSTGRES_DSN: postgresql+psycopg://ecdat:ecdat@postgres:5432/ecdat
      ECDAT_REDIS_URL: redis://redis:6379/0
      ECDAT_NEO4J_URI: bolt://neo4j:7687
    command: dramatiq ecdat.worker.tasks
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_ECDAT_API_BASE_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_ECDAT_API_BASE_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  neo4j_data:
  ecdat_intake:
